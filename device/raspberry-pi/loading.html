<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinetoFun</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; cursor: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px;
         font-family: "Nunito", "Noto Sans", sans-serif; color: #6d28d9; }
  img { width: 360px; max-width: 40vw; }
  .spinner { width: 64px; height: 64px; border-radius: 50%; border: 7px solid #ede9fe; border-top-color: #7c3aed;
             animation: spin 0.9s linear infinite; }
  p { margin: 0; font-size: 28px; font-weight: 700; opacity: 0; transition: opacity 0.6s; }
  p.show { opacity: 0.8; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <img src="logo.png" alt="KinetoFun">
  <div class="spinner"></div>
  <p id="msg">Connecting to Wi-Fi…</p>
<script>
  // Everything after "?to=" is the TV page, passed unencoded so its own query string survives.
  const target = location.search.startsWith("?to=") ? location.search.slice(4) : null;
  const origin = target ? new URL(target).origin : null;
  const started = Date.now();

  // An image probe works from file:// where fetch to another origin would be blocked by CORS.
  function probe() {
    if (!origin) return;
    const img = new Image();
    img.onload = () => location.replace(target);
    img.onerror = () => {
      // Only mention Wi-Fi if it is taking a while, so a normal boot just shows the spinner.
      if (Date.now() - started > 8000) document.getElementById("msg").classList.add("show");
      setTimeout(probe, 2000);
    };
    img.src = origin + "/logo.png?t=" + Date.now();
  }
  probe();
</script>
</body>
</html>
