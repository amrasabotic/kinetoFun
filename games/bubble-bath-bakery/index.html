<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Bath Bakery</title>
<style>
:root { --mint:#cfeee2; --pink:#ff8fb8; --cream:#fff8ee; --cocoa:#5a3622; --board:#2f4a3a; --chalk:#f4f1e8; --cork:#c99a63; --gold:#f5b642; }

html, body { height:100%; }

  font:bold 24px 'Trebuchet MS','DejaVu Sans',sans-serif; color:var(--cocoa); line-height:1.1; padding:0 30px;
  background:radial-gradient(circle, var(--cream) 0 27%, #e7b77d 28% 36%, var(--pink) 37% 64%, #e7b77d 65% 70%, transparent 71%); }
.donut::before { content:''; position:absolute; inset:-14px; border-radius:50%; background:conic-gradient(#fff 0 calc(var(--p, 0) * 360deg), transparent 0);
  -webkit-mask:radial-gradient(circle, transparent 64%, #000 65%); mask:radial-gradient(circle, transparent 64%, #000 65%); }
.donut::after { content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 30% 30%, #fff 0 3px, transparent 4px), radial-gradient(circle at 70% 26%, #4d6fd6 0 3px, transparent 4px),
  radial-gradient(circle at 80% 60%, #ffd166 0 3px, transparent 4px), radial-gradient(circle at 26% 70%, #3fb07a 0 3px, transparent 4px), radial-gradient(circle at 60% 82%, #fff 0 3px, transparent 4px); }

.donut.big { width:210px; height:210px; font-size:30px; }

#menu { background:var(--mint); }
.chalk { position:absolute; left:50px; top:40px; width:640px; height:600px; background:var(--board); border:22px solid #8a5a34; border-radius:10px; box-shadow:0 12px 24px rgba(0,0,0,0.25);
  padding:30px 34px; color:var(--chalk); font-family:'Segoe Print','Comic Sans MS','DejaVu Sans',sans-serif; }
.chalk h1 { font-size:56px; line-height:1.05; color:#fff; text-shadow:0 0 2px rgba(255,255,255,0.6); }
.chalk h1 em { font-style:normal; color:#ffc2d6; }
.chalk p { font-size:21px; margin-top:8px; opacity:0.9; }
.chalk ol { margin-top:18px; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:12px; }
.chalk li { font-size:21px; line-height:1.3; display:flex; gap:12px; align-items:center; }
.chalk li canvas { width:56px; height:56px; flex:none; }
.chalk li b { color:#ffe28a; }
#menu .donut.big { left:880px; top:110px; }
#menu .donut.snd { left:730px; top:320px; width:150px; height:150px; font-size:19px; }
#menu .donut.exit { left:1000px; top:40px; width:150px; height:150px; font-size:19px; }

#cork { background:var(--cork); background-image:radial-gradient(rgba(90,54,34,0.25) 1.5px, transparent 2px), radial-gradient(rgba(255,240,200,0.25) 1.5px, transparent 2px);
  background-size:18px 18px, 23px 23px; background-position:0 0, 9px 11px; }
#cork h2 { position:absolute; left:50px; top:28px; font-size:44px; color:var(--cream); text-shadow:0 3px 0 rgba(90,54,34,0.6); }

.ticket { position:relative; height:200px; padding:22px 14px 12px; background:#fffdf6; box-shadow:0 8px 14px rgba(0,0,0,0.25); cursor:pointer; text-align:center;
  background-image:linear-gradient(0deg, rgba(255,143,184,0.35) calc(var(--p, 0) * 100%), transparent 0); }
.ticket:nth-child(odd) { transform:rotate(-2deg); } .ticket:nth-child(even) { transform:rotate(1.5deg); }
.ticket::before { content:''; position:absolute; left:50%; top:-10px; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #ff8f8f, #c0262f); box-shadow:0 3px 3px rgba(0,0,0,0.3); }
.ticket .day { font-size:20px; letter-spacing:0.1em; color:#b0805a; }
.ticket .nm { font-size:22px; font-weight:bold; margin:4px 0 6px; }
.ticket .items { font-size:18px; color:#7a5a44; line-height:1.3; }
.ticket .stars svg { width:24px; height:24px; }
.ticket.hot { outline:4px solid var(--pink); }
.ticket.locked { filter:grayscale(1) opacity(0.55); cursor:default; }
#cork .donut { left:40px; top:560px; width:140px; height:140px; font-size:20px; }

#sign { position:absolute; left:50%; top:10px; transform:translateX(-50%); padding:8px 26px; background:#8a5a34; color:var(--cream); border-radius:12px; box-shadow:0 5px 0 #5a3622;
  font-size:22px; font-weight:bold; white-space:nowrap; pointer-events:none; }
#task { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); padding:10px 26px; background:var(--cream); border:4px solid var(--pink); border-radius:24px;
  font-size:26px; font-weight:bold; white-space:nowrap; pointer-events:none; box-shadow:0 5px 0 rgba(90,54,34,0.2); }
#task small { font-size:20px; font-weight:normal; color:#7a5a44; margin-left:8px; }
#intro { position:absolute; inset:0; background:rgba(255,248,238,0.75); }
#intro[hidden] { display:none; }
#intro .card { position:absolute; left:50%; top:80px; transform:translateX(-50%) rotate(-1deg); width:700px; padding:26px 34px; background:#fffdf6; box-shadow:0 10px 20px rgba(0,0,0,0.2); text-align:center; }
#intro h2 { font-size:40px; }
#intro p { font-size:22px; line-height:1.45; margin-top:8px; color:#7a5a44; }
#intro .donut { left:535px; top:440px; }

#result { background:var(--mint); }
.receipt { position:absolute; left:50%; top:40px; transform:translateX(-50%); width:520px; padding:26px 34px 34px; background:#fffdf6; box-shadow:0 10px 20px rgba(0,0,0,0.2);

.receipt .stars { display:flex; justify-content:center; gap:6px; margin:8px 0; }
.receipt .stars svg { width:58px; height:58px; }
.receipt .lines { display:grid; grid-template-columns:1fr auto; gap:4px 20px; font-size:22px; text-align:left; border-top:3px dashed #c9b49a; padding-top:10px; }
.receipt .lines .v { font-weight:bold; }
#result .donut.d1 { left:300px; top:520px; width:170px; height:170px; }
#result .donut.d2 { left:560px; top:530px; width:150px; height:150px; font-size:20px; }
#result .donut.d3 { left:800px; top:530px; width:150px; height:150px; font-size:20px; }

#cam { position:absolute; right:16px; bottom:16px; width:192px; height:144px; border-radius:20px; border:5px solid #fff; object-fit:cover; transform:scaleX(-1); background:#000; box-shadow:0 4px 10px rgba(0,0,0,0.2); }
#cam.off { opacity:0; }
#hint { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); font-size:22px; padding:8px 20px; border-radius:20px; background:#fffdf6; border:3px solid var(--pink);
  white-space:nowrap; pointer-events:none; z-index:5; }
#hint.play { bottom:auto; top:64px; }
#hint[hidden] { display:none; }
#toast { position:absolute; left:50%; top:16px; transform:translateX(-50%); font-size:22px; font-weight:bold; padding:12px 22px; border-radius:20px; background:var(--pink); color:#fff;
  opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:6; }
#toast.show { opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="shop" width="1280" height="720"></canvas>

  <section class="screen on" id="menu">
    <div class="chalk">
      <h1>Bubble Bath <em>Bakery</em></h1>
      <p>Bake treats for hungry customers, all with your hands!</p>
      <ol>
        <li><canvas width="56" height="56" data-icon="knead"></canvas><div><b>Knead:</b> open and close your hand.</div></li>
        <li><canvas width="56" height="56" data-icon="roll"></canvas><div><b>Roll:</b> sweep your hand left and right.</div></li>
        <li><canvas width="56" height="56" data-icon="bake"></canvas><div><b>Bake:</b> make a fist when the needle is in the gold.</div></li>
        <li><canvas width="56" height="56" data-icon="jar"></canvas><div><b>Decorate:</b> rest your hand on the jars the customer asks for.</div></li>
      </ol>
    </div>
    <button type="button" class="donut big" data-dwell="play"><span>Open the shop</span></button>
    <button type="button" class="donut choc snd" data-dwell="sound" id="btn-sound"><span>Sound on</span></button>
    <button type="button" class="donut choc exit" data-dwell="exit" id="btn-exit" hidden><span>Back to games</span></button>
  </section>

  <section class="screen" id="cork">
    <h2>Today's orders</h2>
    <div class="tickets" id="tickets"></div>
    <button type="button" class="donut choc" data-dwell="menu"><span>Menu</span></button>
  </section>

  <section class="screen" id="play">
    <div id="sign"></div>
    <div id="task"></div>
    <div id="intro">
      <div class="card"><h2 id="in-title"></h2><p id="in-text"></p></div>
      <button type="button" class="donut big" data-dwell="begin"><span>Let's bake!</span></button>
    </div>
  </section>

  <section class="screen" id="result">
    <div class="receipt"><h2 id="rs-title"></h2><div class="stars" id="rs-stars"></div><div class="lines" id="rs-lines"></div></div>
    <div id="rs-buttons"></div>
  </section>

  <video id="cam" autoplay muted playsinline></video>
  <div id="hint" hidden></div>
  <div id="toast"></div>
</div>
<canvas id="ink"></canvas>

<script src="bakery.js"></script>
<script type="module">

// Points from every day of baking since the game was opened; reported once, when the player leaves or finishes the last day.
let sessionScore = 0;
function reportScore() {
  if (sessionScore <= 0) return false;
  window.parent.postMessage({ type: 'GAME_COMPLETE', score: Math.round(sessionScore) }, '*');

}

// ---------- sound ----------

  knead() { thud(500, 0.45); },
  roll() { thud(900, 0.25); tone(300, 0.12, 'sine', 0.04, 360); },
  ding() { tone(1568, 0.6, 'sine', 0.1); tone(2093, 0.6, 'sine', 0.05, 0, 0.02); },

  wrong() { tone(260, 0.2, 'sine', 0.07, 200); },

// ---------- drawing ----------

const CUSTOMERS = ['bunny', 'bear', 'cat', 'fox'];
function drawCustomer(c, who, x, y, t, happy) {

const backdrop = document.createElement('canvas');
backdrop.width = 1280; backdrop.height = 720;
(function paintShop(c) {
  c.fillStyle = '#cfeee2'; c.fillRect(0, 0, 1280, 720);

  const fist = hand.pose === 'fist';
  c.fillStyle = fist ? '#ff8fb8' : '#fffdf6'; c.strokeStyle = '#5a3622'; c.lineWidth = 3;
  c.beginPath(); c.arc(hand.x, hand.y, fist ? 14 : 18, 0, Math.PI * 2); c.fill(); c.stroke();
  if (dwell.el && dwell.p > 0) { c.strokeStyle = '#ff8fb8'; c.lineWidth = 7; c.beginPath(); c.arc(hand.x, hand.y, 30, -Math.PI / 2, -Math.PI / 2 + dwell.p * Math.PI * 2); c.stroke(); }
}

// ---------- main loop ----------
let lastFrame = performance.now(), rollX = 0.5;
function frame(now) {
  requestAnimationFrame(frame);
  // The oven needle runs on the real frame time, capped so a stall on a slow device cannot skip it ahead.
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  detect(now);
  updatePresence(now);
  if (screen === 'play' && day && playing && !day.done && now >= happyUntil) {
    let input = null;
    if (hand.present) { const p = toStage(hand.x, hand.y); input = { x: p.x / 1280, y: p.y / 720, pose: hand.pose }; }
    else if (mouse.x !== null) { const p = toStage(mouse.x, mouse.y); input = { x: p.x / 1280, y: p.y / 720, pose: mouse.down ? 'fist' : 'open' }; }
    if (input) rollX = Math.max(0, Math.min(1, (input.x - 0.25) * 2));
    const before = day.orders[day.current];
    B.step(day, dt, input);
    for (const ev of day.events) {
      if (ev.type === 'knead') { sfx('knead'); puff(640, 540, '#fff3dc', 6); }
      else if (ev.type === 'roll') { sfx('roll'); puff(640, 570, '#fff3dc', 4); }
      else if (ev.type === 'baked') {
        sfx('ding');
        toast(ev.quality === 'perfect' ? 'Golden and perfect!' : ev.quality === 'burnt' ? 'A little burnt, but still tasty!' : 'A bit doughy, but still tasty!');
        if (ev.quality === 'perfect') { unlockAch('golden'); puff(OVEN.x, OVEN.y, '#ffd166', 18); }
      } else if (ev.type === 'topping') { sfx('topping'); const j = B.JARS.find((x) => x.id === ev.id); puff(640, 520, j.color, 12); }
      else if (ev.type === 'wrongjar') sfx('wrong');
      else if (ev.type === 'served') {
        sfx('served'); unlockAch('first');
        const dec = before.steps.find((s) => s.type === 'decorate');
        servedTreat = { kind: ev.kind, bake: ev.bake, toppings: dec ? dec.toppings : [], who: CUSTOMERS[day.orders.indexOf(before) % CUSTOMERS.length] };
        happyUntil = now + 1600;
        for (let k = 0; k < 3; k++) puff(150, 330, '#ff8fb8', 6);
      } else if (ev.type === 'customer') setTimeout(() => sfx('bell'), 1600);
      else if (ev.type === 'done') { sfx('done'); endAt = now + 2000; }
    }
    day.events.length = 0;
  }
  if (endAt && now >= endAt) { endAt = 0; finishDay(); }
  if (screen === 'play' || screen === 'menu') renderShop(now, dt);
  updateDwell(now);
  updateHud(now);
  renderInk();
}

show('menu');
requestAnimationFrame(frame);
initTracking();
</script>
