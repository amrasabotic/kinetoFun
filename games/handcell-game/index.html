<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HandCell</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a14; overflow:hidden; font-family:'Segoe UI',sans-serif; color:#fff; }
#gameCanvas { display:block; position:fixed; inset:0; z-index:1; }

/* Camera feed — right side */
#camPanel {
  position:fixed; top:12px; right:12px;
  width:240px; height:180px;
  border-radius:14px; overflow:hidden;
  border:2px solid rgba(255,255,255,0.15);
  background:#000; z-index:30;
  box-shadow:0 4px 24px rgba(0,0,0,0.6);
}
#videoEl {
  width:240px; height:180px;
  object-fit:cover;
  transform:scaleX(-1); /* mirror so it feels natural */
  display:block;
}
#skeletonCanvas {
  position:absolute; top:0; left:0;
  width:240px; height:180px; pointer-events:none;
}
#gesturePill {
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.65); border-radius:20px;
  padding:4px 14px; font-size:13px; font-weight:600; color:#ffe066;
  white-space:nowrap; pointer-events:none;
  transition: opacity 0.2s;
}

/* Minimap — left side */
#minimap {
  position:fixed; top:12px; left:12px;
  width:150px; height:150px;
  border-radius:12px; overflow:hidden;
  border:1.5px solid rgba(255,255,255,0.12);
  background:rgba(0,0,0,0.5); z-index:30;
}
#minimapCanvas { display:block; width:150px; height:150px; }

/* Score */
#score {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  font-size:28px; font-weight:800; color:#a8d8ff;
  text-shadow:0 0 16px rgba(100,180,255,0.5);
  z-index:30; pointer-events:none;
}
#massLbl {
  position:fixed; top:50px; left:50%; transform:translateX(-50%);
  font-size:11px; letter-spacing:3px; color:rgba(255,255,255,0.3);
  text-transform:uppercase; z-index:30; pointer-events:none;
}

/* Status */
#status {
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  font-size:12px; color:rgba(255,255,255,0.35); z-index:30; pointer-events:none;
  letter-spacing:0.5px;
}

/* Overlay — waiting for hand */
#overlay {
  position:fixed; inset:0; background:rgba(8,8,20,0.94);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; z-index:50;
  transition: opacity 0.5s;
}
#overlay h1 {
  font-size:60px; font-weight:900;
  background:linear-gradient(135deg,#60c8ff,#b06eff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
#overlay .sub { font-size:16px; color:rgba(255,255,255,0.45); text-align:center; line-height:1.8; max-width:360px; }
#waitMsg { font-size:18px; font-weight:600; color:#ffe066; min-height:28px; }
.gcards { display:flex; gap:18px; }
.gcard { background:rgba(255,255,255,0.07); border-radius:14px; padding:14px 20px; text-align:center; }
.gcard .em { font-size:28px; margin-bottom:6px; }
.gcard .lbl { font-size:11px; color:rgba(255,255,255,0.4); }

/* Death screen */
#deathScreen {
  position:fixed; inset:0; background:rgba(8,8,20,0.95);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; z-index:50;
}
#deathScreen h2 { font-size:48px; font-weight:900; color:#ff6b6b; }
#deathFinal { font-size:20px; color:rgba(255,255,255,0.5); }
#restartHint { font-size:15px; color:#ffe066; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- Camera right -->
<div id="camPanel">
  <video id="videoEl" autoplay playsinline muted></video>
  <canvas id="skeletonCanvas" width="240" height="180"></canvas>
  <div id="gesturePill">Waiting for hand…</div>
</div>

<!-- Minimap left -->
<div id="minimap">
  <canvas id="minimapCanvas" width="150" height="150"></canvas>
</div>

<div id="score">0</div>
<div id="massLbl">MASS</div>
<div id="status">Starting camera…</div>

<div id="overlay">
  <h1>HandCell</h1>
  <div class="sub">Control your cell with your bare hand.<br>No mouse, no keyboard — just gestures.</div>
  <div class="gcards">
    <div class="gcard"><div class="em">☝️</div><div class="lbl">Point — Steer</div></div>
    <div class="gcard"><div class="em">🤏</div><div class="lbl">Pinch — Sprint</div></div>
    <div class="gcard"><div class="em">🖐️</div><div class="lbl">Open Palm — Split</div></div>
  </div>
  <div id="waitMsg">Show your hand to start…</div>
</div>

<div id="deathScreen">
  <h2>Absorbed!</h2>
  <div id="deathFinal"></div>
  <div id="restartHint">✋ Show open palm to restart</div>
</div>

<script type="module">
import { GestureRecognizer, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

// ── DOM refs ────────────────────────────────────────────────────────────────
const gameCanvas   = document.getElementById('gameCanvas');
const gCtx         = gameCanvas.getContext('2d');
const videoEl      = document.getElementById('videoEl');
const skelCanvas   = document.getElementById('skeletonCanvas');
const sCtx         = skelCanvas.getContext('2d');
const mmCanvas     = document.getElementById('minimapCanvas');
const mmCtx        = mmCanvas.getContext('2d');
const scoreEl      = document.getElementById('score');
const statusEl     = document.getElementById('status');
const gesturePill  = document.getElementById('gesturePill');
const overlay      = document.getElementById('overlay');
const waitMsg      = document.getElementById('waitMsg');
const deathScreen  = document.getElementById('deathScreen');

gameCanvas.width  = window.innerWidth;
gameCanvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  gameCanvas.width  = window.innerWidth;
  gameCanvas.height = window.innerHeight;
});

// ── constants ───────────────────────────────────────────────────────────────
const WORLD=3000, FOOD_N=380, VIRUS_N=14, BOT_N=10;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const hsl=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;

// ── hand state ───────────────────────────────────────────────────────────────
// smoothNx/smoothNy are exponentially smoothed versions of the raw finger pos
let hand = { nx:0.5, ny:0.5, smoothNx:0.5, smoothNy:0.5, gesture:'none', visible:false };
const HAND_SMOOTH = 0.08; // lower = more smoothing / less twitchy
// nx,ny are ALREADY mirrored (we flip x=1-raw so right hand moves right)

// ── gesture recognition ──────────────────────────────────────────────────────
let recognizer = null;

async function initMP() {
  statusEl.textContent = 'Loading hand model…';
  try {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
    );
    recognizer = await GestureRecognizer.createFromOptions(vision, {
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numHands:1,
      minHandDetectionConfidence:0.55,
      minHandPresenceConfidence:0.55,
      minTrackingConfidence:0.5
    });

    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ width:640, height:480, facingMode:'user' }
    });
    videoEl.srcObject = stream;
    await new Promise(r => { videoEl.onloadeddata = r; });
    statusEl.textContent = '✋ Show your hand to begin';
    runDetection();
  } catch(e) {
    statusEl.textContent = '⚠ ' + e.message;
    console.error(e);
  }
}

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];

function classifyGesture(lm) {
  const thumbTip=lm[4], indexTip=lm[8], midTip=lm[12];
  const ringTip=lm[16], pinkyTip=lm[20];
  const indexPIP=lm[6], midPIP=lm[10], ringPIP=lm[14], pinkyPIP=lm[18];

  const pinchD = Math.hypot(thumbTip.x-indexTip.x, thumbTip.y-indexTip.y);

  // extended = tip above its PIP joint (smaller y = higher in frame)
  const ext = [
    indexTip.y < indexPIP.y - 0.025,
    midTip.y   < midPIP.y   - 0.025,
    ringTip.y  < ringPIP.y  - 0.025,
    pinkyTip.y < pinkyPIP.y - 0.025
  ];
  const up = ext.filter(Boolean).length;

  if (pinchD < 0.08)  return 'pinch';
  if (up >= 3)        return 'open';
  return 'point';
}

function drawSkeleton(lm) {
  // mirror horizontally on the 240px canvas
  sCtx.clearRect(0,0,240,180);
  // connections
  sCtx.strokeStyle='rgba(80,200,255,0.65)';
  sCtx.lineWidth=1.8;
  HAND_CONNECTIONS.forEach(([a,b])=>{
    sCtx.beginPath();
    sCtx.moveTo((1-lm[a].x)*240, lm[a].y*180);
    sCtx.lineTo((1-lm[b].x)*240, lm[b].y*180);
    sCtx.stroke();
  });
  // joints
  lm.forEach((p,i)=>{
    sCtx.beginPath();
    const r = i===0?5:i%4===0?4:2.5;
    sCtx.arc((1-p.x)*240, p.y*180, r, 0, Math.PI*2);
    sCtx.fillStyle = i===8?'#ffe066': i===4?'#ff7eb3':'#60c8ff';
    sCtx.fill();
  });
}

let handSeenFrames = 0; // used to auto-start

function runDetection() {
  if (!recognizer) return;
  const now = performance.now();
  try {
    const res = recognizer.recognizeForVideo(videoEl, now);
    if (res.landmarks && res.landmarks.length > 0) {
      const lm = res.landmarks[0];
      const g  = classifyGesture(lm);
      hand.visible = true;
      hand.nx = lm[8].x; // raw — will mirror in updatePlayer
      hand.ny = lm[8].y;
      // smooth the position so tiny wobbles don't jerk the cell
      hand.smoothNx += (hand.nx - hand.smoothNx) * HAND_SMOOTH;
      hand.smoothNy += (hand.ny - hand.smoothNy) * HAND_SMOOTH;
      hand.gesture = g;

      drawSkeleton(lm);
      gesturePill.textContent =
        g==='pinch' ? '🤏 Pinch — Sprint' :
        g==='open'  ? '🖐️ Open — Split' :
        '☝️ Pointing';
      gesturePill.style.color = g==='pinch'?'#ffe066': g==='open'?'#ff7eb3':'#a8d8ff';

      // auto-start: hand visible for 20 frames
      if (gameState==='menu') {
        handSeenFrames++;
        if (handSeenFrames >= 20) {
          waitMsg.textContent = '✅ Hand detected — starting!';
          setTimeout(startGame, 600);
        } else {
          waitMsg.textContent = `Hold still… ${Math.round(handSeenFrames/20*100)}%`;
        }
      }
      // restart on open palm
      if (gameState==='dead' && g==='open') {
        startGame();
      }
    } else {
      hand.visible = false;
      hand.gesture = 'none';
      sCtx.clearRect(0,0,240,180);
      gesturePill.textContent = 'No hand detected';
      gesturePill.style.color = 'rgba(255,255,255,0.4)';
      if (gameState==='menu') handSeenFrames = 0;
    }
  } catch(e) {}
  requestAnimationFrame(runDetection);
}

// ── game state ───────────────────────────────────────────────────────────────
let gameState = 'menu';
let food=[], viruses=[], bots=[], player={};
let cam2D={x:WORLD/2,y:WORLD/2,scale:1};
let splitCD=0;

function spawnFood(){
  food=Array.from({length:FOOD_N},()=>({x:rand(40,WORLD-40),y:rand(40,WORLD-40),r:rand(5,9),hue:rand(0,360)}));
}
function spawnViruses(){
  viruses=Array.from({length:VIRUS_N},()=>({x:rand(120,WORLD-120),y:rand(120,WORLD-120),r:40}));
}
function makeBot(i){
  return{id:i,hue:rand(0,360),name:'Bot'+(i+1),alive:true,
    cells:[{x:rand(200,WORLD-200),y:rand(200,WORLD-200),r:rand(18,34),vx:0,vy:0,mt:0}],
    tx:rand(0,WORLD),ty:rand(0,WORLD),retarget:0};
}
function spawnBots(){ bots=Array.from({length:BOT_N},(_,i)=>makeBot(i)); }
function initPlayer(){
  player={cells:[{x:WORLD/2,y:WORLD/2,r:26,vx:0,vy:0,mt:0}],hue:210,alive:true,score:0};
}

function startGame(){
  overlay.style.display='none';
  deathScreen.style.display='none';
  spawnFood(); spawnViruses(); spawnBots(); initPlayer();
  cam2D={x:WORLD/2,y:WORLD/2,scale:1};
  splitCD=0;
  gameState='playing';
  handSeenFrames=0;
}

// ── update ───────────────────────────────────────────────────────────────────
function updatePlayer(){
  if(!player.alive) return;
  // mirror x so physical right = game right, use smoothed position
  const tx=(1-hand.smoothNx)*WORLD, ty=hand.smoothNy*WORLD;
  const boost = hand.gesture==='pinch' ? 6 : 3.2;

  if(hand.gesture==='open' && splitCD<=0 && player.cells.length<8){
    splitCD=55;
    const extra=[];
    player.cells.forEach(c=>{
      if(c.r>20 && player.cells.length+extra.length<8){
        const ang=Math.random()*Math.PI*2;
        const nr=c.r/Math.SQRT2;
        c.r=nr; c.mt=140;
        extra.push({x:c.x+Math.cos(ang)*nr*2,y:c.y+Math.sin(ang)*nr*2,r:nr,vx:Math.cos(ang)*10,vy:Math.sin(ang)*10,mt:140});
      }
    });
    player.cells.push(...extra);
  }

  player.cells.forEach(c=>{
    const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy)||1;
    const spd=boost/Math.sqrt(c.r)*18;
    c.vx+=(dx/d)*spd*0.13; c.vy+=(dy/d)*spd*0.13;
    c.vx*=0.87; c.vy*=0.87;
    c.x=Math.max(c.r,Math.min(WORLD-c.r,c.x+c.vx));
    c.y=Math.max(c.r,Math.min(WORLD-c.r,c.y+c.vy));
    if(c.mt>0)c.mt--;
  });

  // merge
  for(let i=0;i<player.cells.length;i++){
    for(let j=i+1;j<player.cells.length;j++){
      const a=player.cells[i],b=player.cells[j];
      if(a.mt<=0&&b.mt<=0&&dist(a,b)<(a.r+b.r)*0.45){
        a.r=Math.sqrt(a.r*a.r+b.r*b.r);
        player.cells.splice(j,1);j--;
      }
    }
  }

  // eat food
  food=food.filter(f=>{
    for(const c of player.cells){
      if(dist(c,f)<c.r){c.r=Math.sqrt(c.r*c.r+f.r*f.r*0.4);return false;}
    }
    return true;
  });
  while(food.length<FOOD_N) food.push({x:rand(40,WORLD-40),y:rand(40,WORLD-40),r:rand(5,9),hue:rand(0,360)});

  // virus
  viruses.forEach(v=>{
    player.cells.forEach(c=>{
      if(c.r>v.r*1.15&&dist(c,v)<c.r&&player.cells.length<8){
        const splits=Math.min(8-player.cells.length,5);
        const nr=c.r/Math.sqrt(splits+1);
        c.r=nr;c.mt=200;
        for(let s=0;s<splits;s++){
          const ang=(s/splits)*Math.PI*2;
          player.cells.push({x:c.x+Math.cos(ang)*nr,y:c.y+Math.sin(ang)*nr,r:nr,vx:Math.cos(ang)*11,vy:Math.sin(ang)*11,mt:200});
        }
      }
    });
  });

  // player eats bot cells
  bots.forEach(bot=>{
    if(!bot.alive)return;
    bot.cells=bot.cells.filter(bc=>{
      for(const pc of player.cells){
        if(pc.r>bc.r*1.15&&dist(pc,bc)<pc.r){
          pc.r=Math.sqrt(pc.r*pc.r+bc.r*bc.r);
          return false;
        }
      }
      return true;
    });
    if(bot.cells.length===0) bot.alive=false;
  });

  // bot eats player cells
  bots.forEach(bot=>{
    if(!bot.alive)return;
    bot.cells.forEach(bc=>{
      player.cells=player.cells.filter(pc=>{
        if(bc.r>pc.r*1.15&&dist(bc,pc)<bc.r){bc.r=Math.sqrt(bc.r*bc.r+pc.r*pc.r);return false;}
        return true;
      });
    });
  });

  if(player.cells.length===0){player.alive=false;showDeath();return;}
  player.score=Math.round(player.cells.reduce((s,c)=>s+c.r*c.r,0)/80);
  scoreEl.textContent=player.score;
}

function updateBots(){
  bots.forEach(bot=>{
    if(!bot.alive)return;
    if(--bot.retarget<=0){
      bot.retarget=rand(60,200);
      if(Math.random()<0.35&&player.alive){
        bot.tx=player.cells[0].x+rand(-200,200);
        bot.ty=player.cells[0].y+rand(-200,200);
      }else{bot.tx=rand(80,WORLD-80);bot.ty=rand(80,WORLD-80);}
    }
    bot.cells.forEach(c=>{
      const dx=bot.tx-c.x,dy=bot.ty-c.y,d=Math.hypot(dx,dy)||1;
      const spd=3/Math.sqrt(c.r)*20;
      c.vx=c.vx*0.88+(dx/d)*spd*0.12;
      c.vy=c.vy*0.88+(dy/d)*spd*0.12;
      c.x=Math.max(c.r,Math.min(WORLD-c.r,c.x+c.vx));
      c.y=Math.max(c.r,Math.min(WORLD-c.r,c.y+c.vy));
    });
    food=food.filter(f=>{
      for(const c of bot.cells)if(dist(c,f)<c.r){c.r=Math.sqrt(c.r*c.r+f.r*f.r*0.3);return false;}
      return true;
    });
    if(player.alive){
      bot.cells.forEach(bc=>{
        player.cells.forEach(pc=>{
          if(bc.r>pc.r*1.15&&dist(bc,pc)<bc.r)bc.r=Math.sqrt(bc.r*bc.r+pc.r*pc.r);
        });
      });
    }
  });
}

function updateCam2D(){
  if(!player.alive||!player.cells.length)return;
  let cx=0,cy=0;
  player.cells.forEach(c=>{cx+=c.x;cy+=c.y;});
  cx/=player.cells.length;cy/=player.cells.length;
  const avgR=player.cells.reduce((s,c)=>s+c.r,0)/player.cells.length;
  const ts=Math.min(1.4,Math.max(0.22,180/(avgR*3)));
  cam2D.x+=(cx-cam2D.x)*0.07;
  cam2D.y+=(cy-cam2D.y)*0.07;
  cam2D.scale+=(ts-cam2D.scale)*0.05;
}

// ── render ───────────────────────────────────────────────────────────────────
function w2s(x,y){
  return{sx:(x-cam2D.x)*cam2D.scale+gameCanvas.width/2,
         sy:(y-cam2D.y)*cam2D.scale+gameCanvas.height/2,
         sr:cam2D.scale};
}

function drawGrid(){
  const gs=60;
  const ox=(gameCanvas.width/2-cam2D.x*cam2D.scale)%(gs*cam2D.scale);
  const oy=(gameCanvas.height/2-cam2D.y*cam2D.scale)%(gs*cam2D.scale);
  gCtx.strokeStyle='rgba(255,255,255,0.04)';gCtx.lineWidth=1;
  for(let x=ox;x<gameCanvas.width;x+=gs*cam2D.scale){gCtx.beginPath();gCtx.moveTo(x,0);gCtx.lineTo(x,gameCanvas.height);gCtx.stroke();}
  for(let y=oy;y<gameCanvas.height;y+=gs*cam2D.scale){gCtx.beginPath();gCtx.moveTo(0,y);gCtx.lineTo(gameCanvas.width,y);gCtx.stroke();}
}

function drawCell(x,y,r,hue,label,glow){
  const{sx,sy,sr}=w2s(x,y);const pr=r*sr;
  if(sx+pr<0||sx-pr>gameCanvas.width||sy+pr<0||sy-pr>gameCanvas.height)return;
  gCtx.save();
  if(glow){gCtx.shadowColor=hsl(hue,90,65);gCtx.shadowBlur=22;}
  gCtx.beginPath();gCtx.arc(sx,sy,pr,0,Math.PI*2);
  const g=gCtx.createRadialGradient(sx-pr*.3,sy-pr*.3,pr*.05,sx,sy,pr);
  g.addColorStop(0,hsl(hue,75,82));g.addColorStop(.7,hsl(hue,85,55));g.addColorStop(1,hsl(hue,75,33));
  gCtx.fillStyle=g;gCtx.fill();
  gCtx.shadowBlur=0;
  gCtx.strokeStyle=hsl(hue,65,72);gCtx.lineWidth=Math.max(1,pr*.06);gCtx.stroke();
  if(label&&pr>16){
    gCtx.fillStyle='rgba(255,255,255,0.92)';
    gCtx.font=`${Math.max(10,Math.min(pr*.38,20))}px Segoe UI,sans-serif`;
    gCtx.textAlign='center';gCtx.textBaseline='middle';
    gCtx.fillText(label,sx,sy);
  }
  gCtx.restore();
}

function drawVirus(x,y,r){
  const{sx,sy,sr}=w2s(x,y);const pr=r*sr;
  gCtx.save();
  gCtx.strokeStyle='#44ff88';gCtx.lineWidth=2;
  gCtx.fillStyle='rgba(20,160,60,0.15)';
  gCtx.beginPath();
  for(let i=0;i<24;i++){
    const ang=(i/24)*Math.PI*2-Math.PI/2;
    const rr=i%2===0?pr+7:pr-5;
    i===0?gCtx.moveTo(sx+Math.cos(ang)*rr,sy+Math.sin(ang)*rr):gCtx.lineTo(sx+Math.cos(ang)*rr,sy+Math.sin(ang)*rr);
  }
  gCtx.closePath();gCtx.fill();gCtx.stroke();gCtx.restore();
}

function drawHandCursor(){
  if(!hand.visible||!player.alive)return;
  const wx=(1-hand.nx)*WORLD,wy=hand.ny*WORLD;
  const{sx,sy}=w2s(wx,wy);
  const col=hand.gesture==='pinch'?'#ffe066':hand.gesture==='open'?'#ff7eb3':'#60c8ff';
  gCtx.save();
  gCtx.strokeStyle=col;gCtx.lineWidth=2;gCtx.setLineDash([5,4]);gCtx.globalAlpha=0.55;
  gCtx.beginPath();gCtx.arc(sx,sy,16,0,Math.PI*2);gCtx.stroke();
  gCtx.setLineDash([]);gCtx.globalAlpha=1;
  gCtx.beginPath();gCtx.arc(sx,sy,5,0,Math.PI*2);gCtx.fillStyle=col;gCtx.fill();
  gCtx.restore();
}

function drawMinimap(){
  mmCtx.clearRect(0,0,150,150);
  mmCtx.fillStyle='rgba(0,0,0,0.6)';mmCtx.fillRect(0,0,150,150);
  const sc=150/WORLD;
  food.forEach(f=>{mmCtx.fillStyle=hsl(f.hue,80,60);mmCtx.fillRect(f.x*sc-1,f.y*sc-1,2,2);});
  bots.forEach(b=>{
    if(!b.alive)return;
    b.cells.forEach(c=>{mmCtx.beginPath();mmCtx.arc(c.x*sc,c.y*sc,Math.max(2,c.r*sc),0,Math.PI*2);mmCtx.fillStyle=hsl(b.hue,80,55);mmCtx.fill();});
  });
  if(player.alive){
    player.cells.forEach(c=>{mmCtx.beginPath();mmCtx.arc(c.x*sc,c.y*sc,Math.max(3,c.r*sc),0,Math.PI*2);mmCtx.fillStyle=hsl(player.hue,90,70);mmCtx.fill();});
  }
  const vw=(gameCanvas.width/cam2D.scale)*sc,vh=(gameCanvas.height/cam2D.scale)*sc;
  mmCtx.strokeStyle='rgba(255,255,255,0.35)';mmCtx.lineWidth=1;
  mmCtx.strokeRect((cam2D.x-vw/2/sc)*sc,(cam2D.y-vh/2/sc)*sc,vw,vh);
}

function render(){
  gCtx.fillStyle='#0a0a14';gCtx.fillRect(0,0,gameCanvas.width,gameCanvas.height);
  drawGrid();
  food.forEach(f=>{const{sx,sy,sr}=w2s(f.x,f.y);gCtx.beginPath();gCtx.arc(sx,sy,f.r*sr,0,Math.PI*2);gCtx.fillStyle=hsl(f.hue,90,65);gCtx.fill();});
  viruses.forEach(v=>drawVirus(v.x,v.y,v.r));
  bots.forEach(b=>{if(!b.alive)return;b.cells.forEach(c=>drawCell(c.x,c.y,c.r,b.hue,b.name,false));});
  if(player.alive)player.cells.forEach(c=>drawCell(c.x,c.y,c.r,player.hue,'You',true));
  drawHandCursor();
  const{sx:bx0,sy:by0}=w2s(0,0),{sx:bx1,sy:by1}=w2s(WORLD,WORLD);
  gCtx.strokeStyle='rgba(100,160,255,0.2)';gCtx.lineWidth=3;gCtx.strokeRect(bx0,by0,bx1-bx0,by1-by0);
  drawMinimap();
}

// ── game loop ─────────────────────────────────────────────────────────────────
function loop(){
  if(gameState!=='playing'){requestAnimationFrame(loop);return;}
  if(splitCD>0)splitCD--;
  updatePlayer();
  updateBots();
  updateCam2D();
  render();
  requestAnimationFrame(loop);
}

function showDeath(){
  gameState='dead';
  document.getElementById('deathFinal').textContent=`Final Mass: ${player.score}`;
  deathScreen.style.display='flex';
}

// ── boot ──────────────────────────────────────────────────────────────────────
await initMP();
requestAnimationFrame(loop);
</script>
